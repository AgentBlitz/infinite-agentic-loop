<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Cultural Entanglement - Iteration 18</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            position: relative;
        }

        #quantum-field {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }

        .culture-node {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .culture-node:hover {
            transform: scale(1.1);
            z-index: 100;
        }

        .culture-core {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
        }

        .culture-label {
            margin-top: 5px;
            font-size: 11px;
            text-align: center;
        }

        .entanglement-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.3) 20%,
                rgba(255, 255, 255, 0.3) 80%,
                transparent 100%);
            transform-origin: left center;
            pointer-events: none;
            animation: entanglementPulse 3s infinite;
        }

        @keyframes entanglementPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        .probability-field {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: probabilityWave 4s infinite ease-in-out;
        }

        @keyframes probabilityWave {
            0%, 100% { transform: scale(1); opacity: 0.2; }
            50% { transform: scale(1.5); opacity: 0.1; }
        }

        .quantum-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
        }

        #control-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 20, 0.9);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 300px;
            backdrop-filter: blur(10px);
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #aaa;
        }

        .slider {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            border-radius: 3px;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #4a9eff;
            cursor: pointer;
            border-radius: 50%;
        }

        .button {
            background: #4a9eff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
            margin-top: 5px;
            transition: background 0.3s;
        }

        .button:hover {
            background: #357abd;
        }

        #measurement-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #4a9eff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .cultural-trait {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: traitOrbit 10s infinite linear;
        }

        @keyframes traitOrbit {
            from { transform: rotate(0deg) translateX(30px) rotate(0deg); }
            to { transform: rotate(360deg) translateX(30px) rotate(-360deg); }
        }

        #evolution-timeline {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 340px;
            height: 80px;
            background: rgba(20, 20, 20, 0.9);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px;
            backdrop-filter: blur(10px);
        }

        .timeline-marker {
            position: absolute;
            width: 2px;
            height: 60px;
            background: rgba(255, 255, 255, 0.5);
            top: 10px;
        }

        #info-display {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 20, 0.9);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            font-size: 12px;
            max-width: 250px;
        }

        .info-row {
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .info-label {
            color: #888;
        }

        .info-value {
            color: #4a9eff;
        }
    </style>
</head>
<body>
    <canvas id="quantum-field"></canvas>
    
    <div id="culture-container"></div>
    
    <div id="control-panel">
        <h3 style="margin-bottom: 20px; text-align: center;">Quantum Controls</h3>
        
        <div class="control-group">
            <label>Entanglement Strength</label>
            <input type="range" class="slider" id="entanglement-slider" min="0" max="100" value="50">
        </div>
        
        <div class="control-group">
            <label>Mutation Probability</label>
            <input type="range" class="slider" id="mutation-slider" min="0" max="100" value="30">
        </div>
        
        <div class="control-group">
            <label>Evolution Speed</label>
            <input type="range" class="slider" id="evolution-slider" min="0" max="100" value="50">
        </div>
        
        <div class="control-group">
            <label>Quantum Coherence</label>
            <input type="range" class="slider" id="coherence-slider" min="0" max="100" value="70">
        </div>
        
        <button class="button" onclick="quantumMeasurement()">Collapse Wavefunction</button>
        <button class="button" onclick="induceMutation()">Induce Mutation</button>
        <button class="button" onclick="resetSimulation()">Reset Universe</button>
    </div>
    
    <div id="info-display">
        <h4 style="margin-bottom: 10px;">Quantum State</h4>
        <div class="info-row">
            <span class="info-label">Active Cultures:</span>
            <span class="info-value" id="culture-count">0</span>
        </div>
        <div class="info-row">
            <span class="info-label">Entanglements:</span>
            <span class="info-value" id="entanglement-count">0</span>
        </div>
        <div class="info-row">
            <span class="info-label">Total Mutations:</span>
            <span class="info-value" id="mutation-count">0</span>
        </div>
        <div class="info-row">
            <span class="info-label">Coherence Level:</span>
            <span class="info-value" id="coherence-level">70%</span>
        </div>
    </div>
    
    <div id="evolution-timeline"></div>
    
    <div id="measurement-indicator">⚛ WAVEFUNCTION COLLAPSED ⚛</div>

    <script>
        const canvas = document.getElementById('quantum-field');
        const ctx = canvas.getContext('2d');
        const cultureContainer = document.getElementById('culture-container');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Culture definitions
        const cultureTypes = [
            { name: 'Techno-Mystic', color: '#4a9eff', traits: ['logic', 'spirit', 'innovation'] },
            { name: 'Bio-Harmonic', color: '#4aff9e', traits: ['nature', 'balance', 'growth'] },
            { name: 'Chrono-Nomad', color: '#ff4a9e', traits: ['time', 'movement', 'memory'] },
            { name: 'Nano-Collective', color: '#ff9e4a', traits: ['unity', 'micro', 'swarm'] },
            { name: 'Void-Seeker', color: '#9e4aff', traits: ['darkness', 'knowledge', 'depth'] },
            { name: 'Crystal-Singer', color: '#4affff', traits: ['resonance', 'structure', 'light'] }
        ];
        
        let cultures = [];
        let entanglements = [];
        let particles = [];
        let mutationCount = 0;
        let evolutionSpeed = 0.5;
        let entanglementStrength = 0.5;
        let mutationProbability = 0.3;
        let quantumCoherence = 0.7;
        
        class Culture {
            constructor(type, x, y) {
                this.type = type;
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.traits = [...type.traits];
                this.evolution = 0;
                this.stability = 1;
                this.entangledWith = [];
                this.probabilityField = Math.random() * 100 + 50;
                this.element = this.createElement();
            }
            
            createElement() {
                const node = document.createElement('div');
                node.className = 'culture-node';
                node.style.left = this.x + 'px';
                node.style.top = this.y + 'px';
                
                const core = document.createElement('div');
                core.className = 'culture-core';
                core.style.background = `radial-gradient(circle, ${this.type.color} 0%, transparent 70%)`;
                
                const label = document.createElement('div');
                label.className = 'culture-label';
                label.textContent = this.type.name;
                
                node.appendChild(core);
                node.appendChild(label);
                
                // Add probability field
                const field = document.createElement('div');
                field.className = 'probability-field';
                field.style.width = this.probabilityField + 'px';
                field.style.height = this.probabilityField + 'px';
                field.style.left = '50%';
                field.style.top = '50%';
                field.style.transform = 'translate(-50%, -50%)';
                field.style.border = `2px solid ${this.type.color}`;
                node.appendChild(field);
                
                // Add cultural traits as orbiting elements
                this.traits.forEach((trait, i) => {
                    const traitEl = document.createElement('div');
                    traitEl.className = 'cultural-trait';
                    traitEl.style.background = this.type.color;
                    traitEl.style.left = '50%';
                    traitEl.style.top = '50%';
                    traitEl.style.animationDelay = `${i * 3.33}s`;
                    core.appendChild(traitEl);
                });
                
                cultureContainer.appendChild(node);
                return node;
            }
            
            update() {
                // Apply quantum drift
                this.vx += (Math.random() - 0.5) * 0.1 * quantumCoherence;
                this.vy += (Math.random() - 0.5) * 0.1 * quantumCoherence;
                
                // Apply entanglement forces
                this.entangledWith.forEach(other => {
                    const dx = other.x - this.x;
                    const dy = other.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist > 200) {
                        this.vx += dx / dist * entanglementStrength * 0.1;
                        this.vy += dy / dist * entanglementStrength * 0.1;
                    } else if (dist < 150) {
                        this.vx -= dx / dist * entanglementStrength * 0.05;
                        this.vy -= dy / dist * entanglementStrength * 0.05;
                    }
                });
                
                // Update position
                this.x += this.vx * evolutionSpeed;
                this.y += this.vy * evolutionSpeed;
                
                // Boundary reflection
                if (this.x < 60 || this.x > canvas.width - 60) this.vx *= -0.8;
                if (this.y < 60 || this.y > canvas.height - 60) this.vy *= -0.8;
                
                this.x = Math.max(60, Math.min(canvas.width - 60, this.x));
                this.y = Math.max(60, Math.min(canvas.height - 60, this.y));
                
                // Apply friction
                this.vx *= 0.98;
                this.vy *= 0.98;
                
                // Evolve
                this.evolution += evolutionSpeed * 0.01;
                
                // Random mutations
                if (Math.random() < mutationProbability * 0.001) {
                    this.mutate();
                }
                
                // Update DOM
                this.element.style.left = this.x + 'px';
                this.element.style.top = this.y + 'px';
                this.element.style.opacity = this.stability;
            }
            
            mutate() {
                mutationCount++;
                this.stability *= 0.9;
                this.probabilityField = Math.random() * 100 + 50;
                
                // Mutation effect
                const flash = document.createElement('div');
                flash.style.position = 'absolute';
                flash.style.width = '100px';
                flash.style.height = '100px';
                flash.style.left = this.x - 50 + 'px';
                flash.style.top = this.y - 50 + 'px';
                flash.style.borderRadius = '50%';
                flash.style.background = `radial-gradient(circle, ${this.type.color} 0%, transparent 70%)`;
                flash.style.pointerEvents = 'none';
                flash.style.animation = 'probabilityWave 1s ease-out';
                document.body.appendChild(flash);
                setTimeout(() => flash.remove(), 1000);
                
                // Affect entangled cultures
                this.entangledWith.forEach(other => {
                    if (Math.random() < entanglementStrength) {
                        other.stability *= 0.95;
                    }
                });
            }
            
            entangleWith(other) {
                if (!this.entangledWith.includes(other)) {
                    this.entangledWith.push(other);
                    other.entangledWith.push(this);
                }
            }
        }
        
        class QuantumParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 5;
                this.vy = (Math.random() - 0.5) * 5;
                this.life = 1;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.01;
                
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.life * 0.5})`;
                ctx.fillRect(this.x - 2, this.y - 2, 4, 4);
            }
        }
        
        function initializeCultures() {
            cultures = [];
            entanglements = [];
            
            cultureTypes.forEach((type, i) => {
                const angle = (i / cultureTypes.length) * Math.PI * 2;
                const radius = Math.min(canvas.width, canvas.height) * 0.3;
                const x = canvas.width / 2 + Math.cos(angle) * radius;
                const y = canvas.height / 2 + Math.sin(angle) * radius;
                
                cultures.push(new Culture(type, x, y));
            });
            
            // Create initial entanglements
            for (let i = 0; i < cultures.length; i++) {
                const culture1 = cultures[i];
                const culture2 = cultures[(i + 1) % cultures.length];
                const culture3 = cultures[(i + 3) % cultures.length];
                
                culture1.entangleWith(culture2);
                culture1.entangleWith(culture3);
            }
            
            updateInfo();
        }
        
        function drawEntanglements() {
            const existingLines = document.querySelectorAll('.entanglement-line');
            existingLines.forEach(line => line.remove());
            
            const drawn = new Set();
            
            cultures.forEach(culture => {
                culture.entangledWith.forEach(other => {
                    const key = [culture, other].sort().join('-');
                    if (!drawn.has(key)) {
                        drawn.add(key);
                        
                        const line = document.createElement('div');
                        line.className = 'entanglement-line';
                        
                        const dx = other.x - culture.x;
                        const dy = other.y - culture.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        const angle = Math.atan2(dy, dx);
                        
                        line.style.width = distance + 'px';
                        line.style.left = culture.x + 'px';
                        line.style.top = culture.y + 'px';
                        line.style.transform = `rotate(${angle}rad)`;
                        line.style.opacity = entanglementStrength;
                        
                        cultureContainer.appendChild(line);
                    }
                });
            });
        }
        
        function drawQuantumField() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw quantum particles
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            // Add new particles occasionally
            if (Math.random() < 0.1) {
                particles.push(new QuantumParticle(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height
                ));
            }
            
            // Draw probability waves
            ctx.strokeStyle = 'rgba(74, 158, 255, 0.1)';
            ctx.lineWidth = 1;
            
            const time = Date.now() * 0.001;
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                for (let y = 0; y < canvas.height; y += 10) {
                    const wave = Math.sin(x * 0.01 + y * 0.01 + time) * 20;
                    ctx.lineTo(x + wave, y);
                }
                ctx.stroke();
            }
        }
        
        function quantumMeasurement() {
            const indicator = document.getElementById('measurement-indicator');
            indicator.style.opacity = '1';
            setTimeout(() => indicator.style.opacity = '0', 2000);
            
            // Collapse probability fields
            cultures.forEach(culture => {
                culture.stability = Math.random() * 0.5 + 0.5;
                culture.probabilityField = Math.random() * 50 + 75;
                
                // Random entanglement changes
                if (Math.random() < 0.3) {
                    const randomCulture = cultures[Math.floor(Math.random() * cultures.length)];
                    if (randomCulture !== culture) {
                        culture.entangleWith(randomCulture);
                    }
                }
            });
            
            updateInfo();
        }
        
        function induceMutation() {
            cultures.forEach(culture => {
                if (Math.random() < 0.5) {
                    culture.mutate();
                }
            });
            updateInfo();
        }
        
        function resetSimulation() {
            cultureContainer.innerHTML = '';
            initializeCultures();
            mutationCount = 0;
            updateInfo();
        }
        
        function updateInfo() {
            document.getElementById('culture-count').textContent = cultures.length;
            document.getElementById('entanglement-count').textContent = 
                cultures.reduce((sum, c) => sum + c.entangledWith.length, 0) / 2;
            document.getElementById('mutation-count').textContent = mutationCount;
            document.getElementById('coherence-level').textContent = 
                Math.round(quantumCoherence * 100) + '%';
        }
        
        function animate() {
            drawQuantumField();
            drawEntanglements();
            
            cultures.forEach(culture => culture.update());
            
            requestAnimationFrame(animate);
        }
        
        // Event listeners
        document.getElementById('entanglement-slider').addEventListener('input', (e) => {
            entanglementStrength = e.target.value / 100;
        });
        
        document.getElementById('mutation-slider').addEventListener('input', (e) => {
            mutationProbability = e.target.value / 100;
        });
        
        document.getElementById('evolution-slider').addEventListener('input', (e) => {
            evolutionSpeed = e.target.value / 100;
        });
        
        document.getElementById('coherence-slider').addEventListener('input', (e) => {
            quantumCoherence = e.target.value / 100;
            updateInfo();
        });
        
        // Initialize timeline
        function initTimeline() {
            const timeline = document.getElementById('evolution-timeline');
            for (let i = 0; i <= 10; i++) {
                const marker = document.createElement('div');
                marker.className = 'timeline-marker';
                marker.style.left = (i * 10) + '%';
                timeline.appendChild(marker);
            }
        }
        
        // Initialize
        initializeCultures();
        initTimeline();
        animate();
        
        // Window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
