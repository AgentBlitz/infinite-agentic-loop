<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synaesthesia Engine - Cross-Sensory Navigation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow: hidden;
            cursor: none;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #interface {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .sensory-cursor {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: all 0.15s ease;
            mix-blend-mode: screen;
        }

        .sound-ripple {
            position: absolute;
            border: 2px solid;
            border-radius: 50%;
            pointer-events: none;
            animation: ripple 2s ease-out forwards;
        }

        @keyframes ripple {
            to {
                transform: scale(20);
                opacity: 0;
            }
        }

        .color-tone {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(30px);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.5); opacity: 0.3; }
        }

        #cognitivePanel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            width: 300px;
            pointer-events: all;
            z-index: 20;
        }

        .cognitive-stat {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-bar {
            width: 150px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .stat-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff006e, #8338ec, #3a86ff);
            transition: width 0.5s ease;
            border-radius: 4px;
        }

        #sensoryMap {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            pointer-events: all;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sensory-node {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .sensory-node:hover {
            transform: scale(1.2);
            background: rgba(255, 255, 255, 0.2);
        }

        .sensory-connection {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            height: 2px;
            transform-origin: left center;
            pointer-events: none;
        }

        #modeSelector {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            pointer-events: all;
            z-index: 20;
        }

        .mode-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            margin: 5px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .mode-btn.active {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .sensory-trail {
            position: absolute;
            pointer-events: none;
        }

        #accessibilityPanel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            pointer-events: all;
            z-index: 20;
        }

        .access-control {
            margin: 10px 0;
        }

        .access-control label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            opacity: 0.8;
        }

        .access-control input[type="range"] {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .access-control input[type="range"]:hover {
            opacity: 1;
        }

        .frequency-visual {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .frequency-visual.active {
            opacity: 1;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="interface">
        <div class="sensory-cursor" id="cursor"></div>
    </div>

    <div id="modeSelector">
        <h3 style="margin-bottom: 10px; font-size: 14px; opacity: 0.8;">Cognitive Style</h3>
        <div class="mode-btn active" data-mode="visual">Visual Dominant</div>
        <div class="mode-btn" data-mode="auditory">Auditory Dominant</div>
        <div class="mode-btn" data-mode="kinesthetic">Kinesthetic</div>
        <div class="mode-btn" data-mode="synesthetic">Full Synesthetic</div>
    </div>

    <div id="cognitivePanel">
        <h3 style="margin-bottom: 15px; font-size: 14px; opacity: 0.8;">Cognitive Processing</h3>
        <div class="cognitive-stat">
            <span>Visual Processing</span>
            <div class="stat-bar">
                <div class="stat-fill" id="visualStat" style="width: 70%"></div>
            </div>
        </div>
        <div class="cognitive-stat">
            <span>Auditory Mapping</span>
            <div class="stat-bar">
                <div class="stat-fill" id="auditoryStat" style="width: 40%"></div>
            </div>
        </div>
        <div class="cognitive-stat">
            <span>Tactile Response</span>
            <div class="stat-bar">
                <div class="stat-fill" id="tactileStat" style="width: 50%"></div>
            </div>
        </div>
        <div class="cognitive-stat">
            <span>Synesthesia Level</span>
            <div class="stat-bar">
                <div class="stat-fill" id="synesthesiaStat" style="width: 30%"></div>
            </div>
        </div>
    </div>

    <div id="sensoryMap">
        <div class="sensory-node" data-sense="sight" style="top: 20px; left: 80px;">👁️</div>
        <div class="sensory-node" data-sense="sound" style="top: 60px; left: 140px;">👂</div>
        <div class="sensory-node" data-sense="touch" style="top: 120px; left: 120px;">✋</div>
        <div class="sensory-node" data-sense="taste" style="top: 120px; left: 60px;">👅</div>
        <div class="sensory-node" data-sense="smell" style="top: 60px; left: 20px;">👃</div>
    </div>

    <div id="accessibilityPanel">
        <h3 style="margin-bottom: 10px; font-size: 14px; opacity: 0.8;">Accessibility</h3>
        <div class="access-control">
            <label>Sensory Intensity</label>
            <input type="range" id="intensitySlider" min="0" max="100" value="50">
        </div>
        <div class="access-control">
            <label>Cross-Modal Strength</label>
            <input type="range" id="crossModalSlider" min="0" max="100" value="30">
        </div>
        <div class="access-control">
            <label>Motion Sensitivity</label>
            <input type="range" id="motionSlider" min="0" max="100" value="70">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const cursor = document.getElementById('cursor');
        const interface = document.getElementById('interface');

        let width, height;
        let mouseX = 0, mouseY = 0;
        let cognitiveMode = 'visual';
        let sensoryIntensity = 0.5;
        let crossModalStrength = 0.3;
        let motionSensitivity = 0.7;

        // Particle system for sensory trails
        const particles = [];
        const maxParticles = 200;
        
        // Sound frequency to color mapping
        const frequencyColors = {
            low: { r: 255, g: 0, b: 110 },
            mid: { r: 131, g: 56, b: 236 },
            high: { r: 58, g: 134, b: 255 }
        };

        // Cognitive processing values
        const cognitiveStats = {
            visual: 0.7,
            auditory: 0.4,
            tactile: 0.5,
            synesthesia: 0.3
        };

        // Sensory connections
        const sensoryConnections = [];

        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.life = 1;
                this.decay = 0.01;
                this.size = Math.random() * 10 + 5;
                this.frequency = Math.random() * 1000 + 200;
                this.color = this.getColorFromFrequency();
            }

            getColorFromFrequency() {
                const freq = this.frequency;
                if (freq < 400) return frequencyColors.low;
                if (freq < 800) return frequencyColors.mid;
                return frequencyColors.high;
            }

            update() {
                // Apply personalized physics based on cognitive mode
                switch(cognitiveMode) {
                    case 'visual':
                        this.vx += (mouseX - this.x) * 0.0001;
                        this.vy += (mouseY - this.y) * 0.0001;
                        break;
                    case 'auditory':
                        const angle = Math.atan2(mouseY - this.y, mouseX - this.x);
                        this.vx = Math.cos(angle + Math.sin(Date.now() * 0.001) * 0.5) * 2;
                        this.vy = Math.sin(angle + Math.sin(Date.now() * 0.001) * 0.5) * 2;
                        break;
                    case 'kinesthetic':
                        const dist = Math.hypot(mouseX - this.x, mouseY - this.y);
                        if (dist < 100) {
                            this.vx *= 1.1;
                            this.vy *= 1.1;
                        }
                        break;
                    case 'synesthetic':
                        this.vx += Math.sin(this.frequency * 0.01) * 0.5;
                        this.vy += Math.cos(this.frequency * 0.01) * 0.5;
                        break;
                }

                // Apply motion sensitivity
                this.x += this.vx * motionSensitivity;
                this.y += this.vy * motionSensitivity;
                
                this.life -= this.decay;
                
                // Damping
                this.vx *= 0.98;
                this.vy *= 0.98;
            }

            draw() {
                ctx.save();
                
                const alpha = this.life * sensoryIntensity;
                ctx.globalAlpha = alpha;
                
                // Draw based on type
                if (this.type === 'sound') {
                    ctx.strokeStyle = `rgb(${this.color.r}, ${this.color.g}, ${this.color.b})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
                    ctx.stroke();
                } else if (this.type === 'color') {
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                    gradient.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${alpha})`);
                    gradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(this.x - this.size, this.y - this.size, this.size * 2, this.size * 2);
                }
                
                ctx.restore();
            }

            isDead() {
                return this.life <= 0;
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function createSoundRipple(x, y, frequency) {
            const ripple = document.createElement('div');
            ripple.className = 'sound-ripple';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            
            const color = frequency < 400 ? frequencyColors.low :
                         frequency < 800 ? frequencyColors.mid : frequencyColors.high;
            ripple.style.borderColor = `rgb(${color.r}, ${color.g}, ${color.b})`;
            
            interface.appendChild(ripple);
            setTimeout(() => ripple.remove(), 2000);
        }

        function createColorTone(x, y, color) {
            const tone = document.createElement('div');
            tone.className = 'color-tone';
            tone.style.left = x + 'px';
            tone.style.top = y + 'px';
            tone.style.background = `rgb(${color.r}, ${color.g}, ${color.b})`;
            
            interface.appendChild(tone);
            
            // Play tone based on color (cross-sensory)
            if (crossModalStrength > 0.5 && 'AudioContext' in window) {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                // Map color to frequency
                const freq = (color.r + color.g + color.b) * 2;
                oscillator.frequency.value = freq;
                gainNode.gain.value = 0.1 * crossModalStrength;
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.2);
            }
            
            setTimeout(() => tone.remove(), 3000);
        }

        function updateCognitiveStats() {
            // Update stats based on user interaction patterns
            const visualStat = document.getElementById('visualStat');
            const auditoryStat = document.getElementById('auditoryStat');
            const tactileStat = document.getElementById('tactileStat');
            const synesthesiaStat = document.getElementById('synesthesiaStat');
            
            visualStat.style.width = (cognitiveStats.visual * 100) + '%';
            auditoryStat.style.width = (cognitiveStats.auditory * 100) + '%';
            tactileStat.style.width = (cognitiveStats.tactile * 100) + '%';
            synesthesiaStat.style.width = (cognitiveStats.synesthesia * 100) + '%';
        }

        function drawSensoryConnections() {
            ctx.save();
            ctx.globalAlpha = 0.3 * crossModalStrength;
            
            const nodes = document.querySelectorAll('.sensory-node');
            nodes.forEach((node, i) => {
                nodes.forEach((otherNode, j) => {
                    if (i < j) {
                        const rect1 = node.getBoundingClientRect();
                        const rect2 = otherNode.getBoundingClientRect();
                        
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([5, 5]);
                        ctx.beginPath();
                        ctx.moveTo(rect1.left + rect1.width/2, rect1.top + rect1.height/2);
                        ctx.lineTo(rect2.left + rect2.width/2, rect2.top + rect2.height/2);
                        ctx.stroke();
                    }
                });
            });
            
            ctx.restore();
        }

        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.1)';
            ctx.fillRect(0, 0, width, height);
            
            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                particle.update();
                particle.draw();
                
                if (particle.isDead()) {
                    particles.splice(i, 1);
                }
            }
            
            // Draw sensory connections
            drawSensoryConnections();
            
            // Create new particles based on movement
            if (Math.random() < 0.3 && particles.length < maxParticles) {
                particles.push(new Particle(
                    mouseX + (Math.random() - 0.5) * 50,
                    mouseY + (Math.random() - 0.5) * 50,
                    Math.random() > 0.5 ? 'sound' : 'color'
                ));
            }
            
            requestAnimationFrame(animate);
        }

        // Event listeners
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            cursor.style.left = mouseX + 'px';
            cursor.style.top = mouseY + 'px';
            
            // Update cursor based on cognitive mode
            switch(cognitiveMode) {
                case 'visual':
                    cursor.style.background = `radial-gradient(circle, 
                        hsla(${(mouseX / width) * 360}, 70%, 50%, 0.8), 
                        transparent)`;
                    break;
                case 'auditory':
                    const freq = (mouseY / height) * 1000 + 200;
                    const color = freq < 400 ? frequencyColors.low :
                                 freq < 800 ? frequencyColors.mid : frequencyColors.high;
                    cursor.style.background = `radial-gradient(circle, 
                        rgba(${color.r}, ${color.g}, ${color.b}, 0.8), 
                        transparent)`;
                    break;
                case 'kinesthetic':
                    cursor.style.background = `radial-gradient(circle, 
                        rgba(255, 255, 255, 0.3), 
                        transparent)`;
                    cursor.style.transform = `translate(-50%, -50%) scale(${1 + Math.abs(e.movementX + e.movementY) * 0.05})`;
                    break;
                case 'synesthetic':
                    const hue = (Date.now() * 0.1 + mouseX) % 360;
                    cursor.style.background = `conic-gradient(
                        from ${hue}deg,
                        hsla(${hue}, 70%, 50%, 0.8),
                        hsla(${hue + 120}, 70%, 50%, 0.8),
                        hsla(${hue + 240}, 70%, 50%, 0.8),
                        hsla(${hue}, 70%, 50%, 0.8)
                    )`;
                    break;
            }
            
            // Update cognitive stats based on movement patterns
            const speed = Math.hypot(e.movementX, e.movementY);
            cognitiveStats.tactile = Math.min(1, cognitiveStats.tactile + speed * 0.0001);
            updateCognitiveStats();
        });

        document.addEventListener('click', (e) => {
            // Create cross-sensory feedback
            const freq = Math.random() * 800 + 200;
            createSoundRipple(e.clientX, e.clientY, freq);
            
            if (crossModalStrength > 0.3) {
                const color = {
                    r: Math.floor((e.clientX / width) * 255),
                    g: Math.floor((e.clientY / height) * 255),
                    b: Math.floor(Math.random() * 255)
                };
                createColorTone(e.clientX, e.clientY, color);
            }
            
            // Add burst of particles
            for (let i = 0; i < 10; i++) {
                particles.push(new Particle(
                    e.clientX + (Math.random() - 0.5) * 20,
                    e.clientY + (Math.random() - 0.5) * 20,
                    Math.random() > 0.5 ? 'sound' : 'color'
                ));
            }
            
            // Update synesthesia level
            cognitiveStats.synesthesia = Math.min(1, cognitiveStats.synesthesia + 0.05);
            updateCognitiveStats();
        });

        // Mode selector
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                cognitiveMode = btn.dataset.mode;
                
                // Update cognitive stats based on mode
                switch(cognitiveMode) {
                    case 'visual':
                        cognitiveStats.visual = 0.9;
                        cognitiveStats.auditory = 0.3;
                        break;
                    case 'auditory':
                        cognitiveStats.visual = 0.3;
                        cognitiveStats.auditory = 0.9;
                        break;
                    case 'kinesthetic':
                        cognitiveStats.tactile = 0.9;
                        break;
                    case 'synesthetic':
                        cognitiveStats.synesthesia = 0.9;
                        break;
                }
                updateCognitiveStats();
            });
        });

        // Sensory node interactions
        document.querySelectorAll('.sensory-node').forEach(node => {
            node.addEventListener('click', (e) => {
                e.stopPropagation();
                const sense = node.dataset.sense;
                
                // Create sensory burst
                for (let i = 0; i < 20; i++) {
                    const angle = (i / 20) * Math.PI * 2;
                    const particle = new Particle(
                        e.clientX + Math.cos(angle) * 30,
                        e.clientY + Math.sin(angle) * 30,
                        'color'
                    );
                    particle.vx = Math.cos(angle) * 5;
                    particle.vy = Math.sin(angle) * 5;
                    particles.push(particle);
                }
                
                // Update cognitive processing
                switch(sense) {
                    case 'sight':
                        cognitiveStats.visual = Math.min(1, cognitiveStats.visual + 0.1);
                        break;
                    case 'sound':
                        cognitiveStats.auditory = Math.min(1, cognitiveStats.auditory + 0.1);
                        break;
                    case 'touch':
                        cognitiveStats.tactile = Math.min(1, cognitiveStats.tactile + 0.1);
                        break;
                    default:
                        cognitiveStats.synesthesia = Math.min(1, cognitiveStats.synesthesia + 0.1);
                }
                updateCognitiveStats();
            });
        });

        // Accessibility controls
        document.getElementById('intensitySlider').addEventListener('input', (e) => {
            sensoryIntensity = e.target.value / 100;
        });

        document.getElementById('crossModalSlider').addEventListener('input', (e) => {
            crossModalStrength = e.target.value / 100;
        });

        document.getElementById('motionSlider').addEventListener('input', (e) => {
            motionSensitivity = e.target.value / 100;
        });

        // Initialize
        resize();
        window.addEventListener('resize', resize);
        animate();
        updateCognitiveStats();

        // Keyboard navigation for accessibility
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case '1':
                    cognitiveMode = 'visual';
                    break;
                case '2':
                    cognitiveMode = 'auditory';
                    break;
                case '3':
                    cognitiveMode = 'kinesthetic';
                    break;
                case '4':
                    cognitiveMode = 'synesthetic';
                    break;
                case 'ArrowUp':
                    sensoryIntensity = Math.min(1, sensoryIntensity + 0.1);
                    document.getElementById('intensitySlider').value = sensoryIntensity * 100;
                    break;
                case 'ArrowDown':
                    sensoryIntensity = Math.max(0, sensoryIntensity - 0.1);
                    document.getElementById('intensitySlider').value = sensoryIntensity * 100;
                    break;
            }
        });
    </script>
</body>
</html>
